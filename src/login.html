<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — suica-opsec-kit</title>
    <style>
        :root {
            --bg: #f3f1ec;
            --panel: #fff;
            --border: #d8dde2;
            --text: #20252b;
            --muted: #687078;
            --accent: #20252b;
            --success: #2f6f4e;
            --error: #b44d2e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "IBM Plex Sans", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .card {
            width: min(420px, calc(100vw - 2rem));
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1.75rem;
        }

        h1 {
            margin: 0 0 0.35rem;
            font-size: 1.35rem;
            font-weight: 700;
        }

        p.lead {
            margin: 0 0 1.25rem;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .banner {
            margin: 0 0 1rem;
            padding: 0.75rem 0.9rem;
            border-radius: 3px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }

        .banner.success {
            color: var(--success);
            background: #f7fbf8;
        }

        .banner.error {
            color: var(--error);
            background: #fbf6f4;
        }

        label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input {
            width: 100%;
            margin-bottom: 1rem;
            padding: 0.65rem 0.75rem;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            font: inherit;
        }

        input:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid var(--accent);
            border-radius: 3px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #46515a;
            border-color: #46515a;
        }

        .hint {
            margin-top: 1rem;
            font-size: 0.82rem;
            color: var(--muted);
            line-height: 1.45;
        }

        a {
            color: var(--text);
            font-weight: 700;
        }

        code {
            font-family: "IBM Plex Mono", monospace;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Login</h1>
        <p class="lead">Autenticacao local via FastAPI + SQLAlchemy.</p>

        <!--BANNER-->

        <form method="post" action="auth/login/form">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}">

            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">

            <button type="submit">Entrar</button>
        </form>

        <p class="hint">
            Usuario demo: <code>demo</code> / <code>DemoPass123!</code><br>
            API JSON: <code>POST /auth/login</code>, <code>POST /auth/register</code>, <code>GET /auth/me</code>
        </p>
    </main>
</body>
</html>
